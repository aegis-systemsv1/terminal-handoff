name: Feature request
description: Suggest an improvement to Terminal Handoff
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Terminal Handoff automates opening Terminal windows and launching agent
        sessions. Changes that make it trigger more eagerly, fall back silently,
        or trust unvalidated input are unlikely to be accepted - see
        CONTRIBUTING.md.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Threshold detection
        - Model or effort preservation
        - Terminal launch
        - Successor behaviour / transcript isolation
        - Safety guards (one-shot, cooldown, circuit breaker)
        - Installation / uninstallation
        - Status-line integration
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This does not require bypassing Claude Code permissions
          required: true
        - label: This does not require a silent fallback to a different model or effort
          required: true
