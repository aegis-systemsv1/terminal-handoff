[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-handoff"
version = "1.2.0"
description = "Automatically hand off long Claude Code sessions to a fresh Terminal context while preserving model, effort and verified working state."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "John Gavin" }]
keywords = ["claude", "claude-code", "macos", "terminal", "context", "handoff", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aegis-systemsv1/terminal-handoff"
Issues = "https://github.com/aegis-systemsv1/terminal-handoff/issues"
Changelog = "https://github.com/aegis-systemsv1/terminal-handoff/blob/main/CHANGELOG.md"

[project.scripts]
terminal-handoff = "terminal_handoff.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
terminal_handoff = ["templates/*.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
